<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e3a8a" />
    <title>サイバー防犯チャレンジ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <h1 id="header-title">サイバー防犯チャレンジ</h1>
      <p class="subtitle" id="header-subtitle">あなたに合ったコースを選んでね！</p>
    </header>

    <main>
      <!-- ===== コース選択画面 ===== -->
      <section id="course-screen" class="screen">
        <div class="card rules">
          <h2>コースを選んでください</h2>
          <p>質問に答えると、ネットやスマホの使い方の“スキ”がわかります。</p>
        </div>
        <div id="course-list" class="course-list"></div>
        <p class="privacy">
          🔒
          この診断では、氏名・連絡先など<strong>個人を特定できる情報は一切取得しません</strong>。回答内容は統計目的でのみ利用します。
        </p>
      </section>

      <!-- ===== 質問画面（1問ずつ） ===== -->
      <section id="quiz-screen" class="screen" hidden>
        <div class="card rules" id="quiz-rule-card">
          <p id="quiz-rule"></p>
        </div>

        <div class="progress" aria-hidden="true">
          <div class="progress-bar"><span id="progress-fill"></span></div>
        </div>
        <p class="progress-text" id="progress-text"></p>

        <div class="card question" id="question-card"></div>

        <div class="nav">
          <button type="button" id="prev-btn" class="btn btn-secondary btn-small">
            ← 前へ
          </button>
          <button type="button" id="next-btn" class="btn btn-primary btn-small">
            次へ →
          </button>
        </div>
      </section>

      <!-- ===== アンケート画面 ===== -->
      <section id="survey-screen" class="screen" hidden>
        <form id="survey-form" novalidate>
          <div class="card survey">
            <h2>アンケート <span class="badge-optional">任意</span></h2>
            <p class="survey-note">答えなくても結果を見られます。</p>

            <fieldset class="survey-item">
              <legend>年齢層</legend>
              <div class="choice-list" id="age-list"></div>
            </fieldset>

            <fieldset class="survey-item">
              <legend>感想（いくつでも）</legend>
              <div class="choice-list" id="impression-list"></div>
            </fieldset>

            <div class="survey-item">
              <label for="impression-text" class="legend-like"
                >ひとこと感想</label
              >
              <input
                type="text"
                id="impression-text"
                name="impression_text"
                placeholder="自由にお書きください"
                autocomplete="off"
              />
            </div>
          </div>

          <p class="privacy">
            🔒
            この診断では、氏名・連絡先など<strong>個人を特定できる情報は一切取得しません</strong>。回答内容は統計目的でのみ利用します。
          </p>

          <button type="submit" class="btn btn-primary">結果を見る</button>
          <button type="button" id="survey-back-btn" class="btn btn-text">
            ← 質問にもどる
          </button>
        </form>
      </section>

      <!-- ===== 結果画面 ===== -->
      <section id="result-screen" class="screen" hidden>
        <div id="result-rank" class="card result-rank">
          <p class="result-score" id="result-score"></p>
          <h2 id="result-title"></h2>
          <p id="result-state"></p>
          <div class="advice-overall" id="result-advice-box">
            <h3>アドバイス</h3>
            <p id="result-advice"></p>
          </div>
        </div>

        <div class="card">
          <h2>1問ずつふりかえり</h2>
          <ol id="review-list" class="review-list"></ol>
        </div>

        <button type="button" id="restart-btn" class="btn btn-secondary">
          最初に戻る
        </button>
      </section>
    </main>

    <footer class="site-footer">
      <p>主催：近畿大学 防犯ボランティア</p>
    </footer>

    <script src="questions.js"></script>
    <script src="script.js"></script>
  </body>
</html>
